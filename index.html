<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>
  <main>
    <section class="play-area">
      <div class="score">
        <div>
          <h3 id="high-score">High Score : 17</h3>
        </div>
        <div>
          <h3 id="score">Score : 5</h3>
        </div>
        <div>
          <h3 id="time">Time : 00:00</h3>
        </div>
      </div>
      <div class="game-board">
      </div>
    </section>
    <div class="modal">
      <div class="start-game">
        <h3>Welcome</h3>
        <button class="btn btn-start">Start</button>
      </div>
      <div class="reset-game">
        <h3>Game Over</h3>
        <button class="btn btn-reset">Restart</button>
      </div>
      <div class="time-up">
        <h3>Oops Time's Up!</h3>
        <button class="btn btn-reset">Restart</button>
      </div>
    </div>
  </main>
</body>
</html>
